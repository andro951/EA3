name: Preserve original menu artwork
on:
  push:
    branches: [main]
    paths: ['tools/reference-assets.json', 'tools/assets.mjs', '.github/workflows/reference-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reference-artwork
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch only checksum-verified public artwork
        run: node tools/assets.mjs
      - name: Preserve artwork in the user's repository
        run: |
          git config user.name 'EA3 asset preservation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/art/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets: preserve checksum-verified EA1 menu artwork'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
